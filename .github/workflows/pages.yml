# Publică automat previzualizarea pe GitHub Pages la fiecare push pe ramura main.
# Previzualizarea are noindex: Google nu o indexează, ca să nu concureze cu caminul-adina.ro.
name: Publicare GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalează Pillow și ffmpeg
        run: |
          pip install pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - id: pages
        uses: actions/configure-pages@v5
      - name: Construiește site-ul
        run: python build.py --env preview --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
